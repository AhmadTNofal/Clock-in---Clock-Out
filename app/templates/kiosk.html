<!doctype html>
<html lang="en-GB">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_name }} &mdash; {{ device_label }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/moduflex.css') }}">
</head>
<body class="mf-kiosk">
<div class="mf-kiosk-shell">

    <div class="mf-kiosk-top">
        <div>
            <span class="mf-brand">{{ app_name }}</span>
            <div class="mf-kiosk-date">
                {{ device_label }} &middot; <span id="kiosk-mode" class="mf-badge">&hellip;</span>
            </div>
        </div>
        <div style="text-align: right;">
            <div class="mf-kiosk-clock" id="kiosk-clock">--:--</div>
            <div class="mf-kiosk-date" id="kiosk-date"></div>
        </div>
    </div>

    <div class="mf-kiosk-body">
        <div class="mf-video-frame">
            <video id="kiosk-video" playsinline muted autoplay></video>
            <div class="mf-video-hint" id="kiosk-hint">Starting camera&hellip;</div>
        </div>

        <div class="mf-kiosk-panel">
            <div class="mf-kiosk-result" id="kiosk-result">
                <div class="mf-result-name" id="result-name">Ready</div>
                <div class="mf-result-action" id="result-action">Starting up&hellip;</div>
                <div class="mf-result-time" id="result-time"></div>
                <div class="mf-result-detail" id="result-detail"></div>
            </div>

            <button class="mf-scan-btn mf-cancel-btn" id="cancel-btn" type="button" hidden>
                Cancel
            </button>

            <button class="mf-scan-btn" id="scan-btn" type="button" disabled>Scan</button>

            <div class="mf-scan-split">
                <button id="scan-in" type="button">Clock in</button>
                <button id="scan-out" type="button">Clock out</button>
            </div>

            <div class="mf-onsite" id="onsite">&nbsp;</div>

            <!-- Diagnostics, shown only with ?debug=1 on the URL. Tuning a kiosk
                 by guesswork is miserable; this shows what it is actually
                 deciding, live. -->
            <pre class="mf-kiosk-debug" id="kiosk-debug" hidden></pre>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/capture.js') }}"></script>
<script>
    window.KIOSK_CONFIG = {
        token: {{ kiosk_token | tojson }},
        scanUrl: {{ url_for('kiosk.api_scan') | tojson }},
        identifyUrl: {{ url_for('kiosk.api_identify') | tojson }},
        commitUrl: {{ url_for('kiosk.api_commit') | tojson }},
        onsiteUrl: {{ url_for('kiosk.api_onsite') | tojson }},
        frames: {{ scan_frames | tojson }},
        autoMode: {{ auto_mode | tojson }},
        confirmSeconds: {{ auto_confirm_seconds | tojson }},
        pollMs: {{ auto_poll_ms | tojson }},
        presenceMs: {{ auto_presence_ms | tojson }},
        presenceThreshold: {{ auto_presence_threshold | tojson }},
        autoFrames: {{ auto_scan_frames | tojson }},
        frameGapMs: {{ auto_frame_gap_ms | tojson }},
        captureMaxWidth: {{ capture_max_width | tojson }},
        requireDeparture: {{ auto_require_departure | tojson }},
        departureMs: {{ auto_departure_ms | tojson }},
        rearmSeconds: {{ auto_rearm_seconds | tojson }},
        latchedPollMs: {{ auto_latched_poll_ms | tojson }},
        idlePollMs: {{ auto_idle_poll_ms | tojson }},
        debug: {{ (request.args.get('debug') == '1') | tojson }}
    };
</script>
<script src="{{ url_for('static', filename='js/kiosk.js') }}"></script>
</body>
</html>
